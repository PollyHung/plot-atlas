<title>Plot Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;
 --surface:#fbfcfd;--panel:#f2f6f9;--sunk:#e9eff4;--ink:#161c22;--ink-2:#3d4852;--muted:#66727e;
 --rule:#dbe3ea;--rule-strong:#c3ced8;--series-1:#2a78d6;--series-2:#eb6834;--accent:#e34948;
 --y:#1baf7a;--p:#eda100;--n:#b9c4ce}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
 --surface:#14171a;--panel:#1b2025;--sunk:#22282e;--ink:#e9eef3;--ink-2:#b6c1cb;--muted:#8b96a2;
 --rule:#272e35;--rule-strong:#39424b;--series-1:#3987e5;--series-2:#d95926;--accent:#e66767;
 --y:#199e70;--p:#c98500;--n:#4a545e}}
:root[data-theme="dark"]{color-scheme:dark;
 --surface:#14171a;--panel:#1b2025;--sunk:#22282e;--ink:#e9eef3;--ink-2:#b6c1cb;--muted:#8b96a2;
 --rule:#272e35;--rule-strong:#39424b;--series-1:#3987e5;--series-2:#d95926;--accent:#e66767;
 --y:#199e70;--p:#c98500;--n:#4a545e}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);
 font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--series-1);text-decoration:none}
a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--series-1);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",monospace}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;letter-spacing:-.012em;text-wrap:balance}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
 backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topin{max-width:1240px;margin:0 auto;padding:11px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand{font-family:Spectral,Georgia,serif;font-size:1.12rem;font-weight:600;color:var(--ink);white-space:nowrap}
.brand span{color:var(--series-1)}
nav.main{display:flex;gap:16px;font-size:13.6px}
nav.main a{color:var(--ink-2)}
nav.main a.on{color:var(--series-1);font-weight:500}
.search{margin-left:auto;position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--rule-strong);border-radius:3px;
 background:var(--surface);color:var(--ink);font:inherit;font-size:13.6px}
.search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.sugg{position:absolute;top:38px;left:0;right:0;background:var(--surface);border:1px solid var(--rule-strong);
 border-radius:3px;max-height:340px;overflow-y:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.sugg.open{display:block}
.sugg a{display:block;padding:7px 11px;color:var(--ink);font-size:13.6px;border-bottom:1px solid var(--rule)}
.sugg a:hover,.sugg a.sel{background:var(--panel);text-decoration:none}
.sugg .sid{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-right:7px}
.sugg .sm{color:var(--muted);font-size:11.5px;margin-left:6px}

main{max-width:1240px;margin:0 auto;padding:0 24px 90px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--muted);margin:0 0 12px}
.crumb{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin:26px 0 14px}
.crumb a{color:var(--muted)}

/* home */
.hero{padding:54px 0 30px;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(2.2rem,5vw,3.5rem);line-height:1.08;margin:0 0 18px;max-width:16ch}
.hero p.lede{font-family:Spectral,Georgia,serif;font-size:1.22rem;line-height:1.5;color:var(--ink-2);max-width:60ch;margin:0}
.counts{display:flex;gap:26px;flex-wrap:wrap;margin-top:30px}
.counts div b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:500;
 font-variant-numeric:tabular-nums}
.counts div span{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--muted)}
.doors{display:grid;gap:16px;margin:38px 0 0}
@media(min-width:820px){.doors{grid-template-columns:repeat(3,1fr)}}
.door{border:1px solid var(--rule);border-radius:3px;padding:22px 20px;background:var(--panel);display:block;color:var(--ink)}
.door:hover{border-color:var(--series-1);text-decoration:none}
.door h3{font-size:1.2rem;margin:0 0 7px}
.door p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.5}
.sec{margin-top:58px}
.sech{border-top:1px solid var(--rule-strong);padding-top:13px;margin-bottom:22px}
.sech span{display:block;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
 text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sech h2{font-size:1.65rem;margin:0}
.sec>p.intro{max-width:66ch;color:var(--ink-2);margin:0 0 24px}

/* generic grid of cards */
.cards{display:grid;gap:10px}
@media(min-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1040px){.cards.c3{grid-template-columns:repeat(3,1fr)}}
.card{border:1px solid var(--rule);border-radius:3px;padding:15px 16px;display:block;color:var(--ink);background:var(--surface)}
.card:hover{border-color:var(--series-1);text-decoration:none}
.card .cid{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.card h4{margin:4px 0 5px;font-size:15px;font-weight:600}
.card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}

/* browse */
.browse{display:grid;gap:28px;margin-top:8px}
@media(min-width:960px){.browse{grid-template-columns:206px minmax(0,1fr);gap:40px}}
.facets{display:flex;flex-direction:column;gap:22px}
@media(min-width:960px){.facets{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow-y:auto}}
.facet h4{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--muted);font-weight:500;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.facet label{display:flex;gap:7px;align-items:baseline;font-size:13.2px;color:var(--ink-2);
 padding:2.5px 0;cursor:pointer;line-height:1.35}
.facet input{margin:0;accent-color:var(--series-1);flex:none;position:relative;top:2px}
.facet .cnt{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.resbar{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.resbar b{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500}
.resbar button{background:none;border:1px solid var(--rule-strong);color:var(--muted);border-radius:3px;
 font:inherit;font-size:11.5px;padding:2px 8px;cursor:pointer}
.tablewrap{border:1px solid var(--rule);border-radius:3px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:13.6px}
thead th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
 text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px;background:var(--panel);
 border-bottom:1px solid var(--rule-strong)}
tbody td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:hover{background:var(--panel)}
td.tid{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);white-space:nowrap}
td.tname a{color:var(--ink);font-weight:500}
td.tname .al{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
 padding:2px 6px;border-radius:2px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.o-D{background:color-mix(in srgb,var(--series-1) 15%,transparent);color:var(--series-1)}
.o-H{background:color-mix(in srgb,var(--p) 22%,transparent);color:var(--p)}
.o-L{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.o-C{background:var(--sunk);color:var(--muted)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.d-deep{background:var(--series-1)}.d-standard{background:var(--rule-strong)}.d-stub{background:none;
 box-shadow:inset 0 0 0 1px var(--rule-strong)}

/* entry */
.entry{display:grid;gap:34px;margin-top:6px}
@media(min-width:980px){.entry{grid-template-columns:minmax(0,1fr) 258px;gap:48px}}
.entry h1{font-size:2.1rem;margin:0 0 8px}
.alias{font-family:"IBM Plex Mono",monospace;font-size:12.6px;color:var(--muted);margin:0}
.metarow{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
.fig{margin:24px 0 0;background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:16px;overflow-x:auto}
.fig svg{width:100%;height:auto;display:block;min-width:400px}
.nofig{margin:24px 0 0;border:1px dashed var(--rule-strong);border-radius:3px;padding:26px 20px;
 color:var(--muted);font-size:13.4px;text-align:center}
.lead{font-family:Spectral,Georgia,serif;font-size:1.14rem;line-height:1.5;color:var(--ink);max-width:62ch;margin:22px 0 0}
.dyad{display:grid;gap:24px;margin-top:26px}
@media(min-width:760px){.dyad{grid-template-columns:1fr 1fr;gap:38px}}
.dyad h4,.side h4{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
 text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.dyad h4.hh{color:var(--accent);border-bottom-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.dyad ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.dyad li{position:relative;padding-left:16px;color:var(--ink-2);font-size:14.8px;line-height:1.48}
.dyad li::before{content:"";position:absolute;left:0;top:.66em;width:7px;height:1px;background:var(--rule-strong)}
.dyad ul.hide li{color:var(--ink)}
.dyad ul.hide li::before{background:var(--accent)}
.dyad ul.yes li::before,.dyad ul.no li::before{width:5px;height:5px;top:.5em;border-radius:50%;
 background:none;border:1px solid var(--rule-strong)}
.dyad ul.yes li::before{border-color:var(--y);background:var(--y)}
.code{display:grid;gap:10px;margin-top:28px}
@media(min-width:700px){.code{grid-template-columns:1fr 1fr}}
.code>div{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:11px 13px;overflow-x:auto}
.lang{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
 color:var(--muted);display:block;margin-bottom:6px}
pre{margin:0}code{font-family:"IBM Plex Mono",monospace;font-size:12.6px;color:var(--ink);white-space:pre}
.side{display:flex;flex-direction:column;gap:26px}
.side section p,.side section div.list{margin:0;font-size:13.6px;color:var(--ink-2)}
.side .list{display:flex;flex-direction:column;gap:5px}
.side .list a{font-size:13.6px}
.toollist{display:flex;flex-direction:column;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:12.2px;color:var(--ink-2)}
.tagrow{display:flex;flex-wrap:wrap;gap:5px}
.sibs{display:flex;flex-direction:column;gap:4px}
.sibs a{font-size:13.6px;color:var(--ink-2)}
.sibs a:hover{color:var(--series-1)}
.stubnote{border-left:2px solid var(--rule-strong);padding:2px 0 2px 14px;color:var(--muted);
 font-size:13.6px;margin:22px 0 0;max-width:60ch}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:12.4px;color:var(--muted)}
footer{border-top:1px solid var(--rule-strong);margin-top:70px;padding:24px 0 60px;color:var(--muted);
 font-size:13.2px;max-width:72ch}
footer p{margin:0 0 9px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<header class="top"><div class="topin">
 <a class="brand" href="#/">Plot <span>Atlas</span></a>
 <nav class="main" id="nav">
   <a href="#/browse">All plots</a><a href="#/shapes">By data shape</a>
   <a href="#/areas">By subject</a><a href="#/origins">By origin</a><a href="#/about">About</a>
 </nav>
 <div class="search">
   <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
   <input id="q" type="search" placeholder="Search 812 plots…" autocomplete="off" aria-label="Search plots">
   <div class="sugg" id="sugg"></div>
 </div>
</div></header>
<main id="app"></main>
